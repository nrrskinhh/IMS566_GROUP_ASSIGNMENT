<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-10 col-lg-8">
                    <div class="auth-card">
                        <div class="row g-0">
                            <div class="col-md-5 auth-sidebar"><h2 class="fw-bold mb-4">Easton Hotel</h2><p class="lead">Luxury & Comfort</p></div>
                            <div class="col-md-7 auth-form-container">
                                <h3 class="mb-4 fw-bold">Welcome Back</h3>
                                <form id="loginForm">
                                    <div class="mb-3"><label class="form-label">Username</label><input type="text" class="form-control" id="username" placeholder="admin" required></div>
                                    <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" id="password" placeholder="admin123" required></div>
                                    <div id="loginError" class="text-danger small mb-3" style="display:none;"></div>
                                    <button type="submit" class="btn btn-gold w-100 py-2">LOGIN</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
