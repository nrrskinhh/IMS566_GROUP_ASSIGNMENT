<html>
<head>
    <title>Rooms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="sb-sidenav-toggled">
    <div class="d-flex" id="wrapper">
        <div class="bg-dark border-end" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom bg-gold text-dark text-center py-3"><i class="bi bi-building-fill-gear fs-4 me-2"></i> EASTON HOTEL</div>
            <div class="list-group list-group-flush">
                <a href="dashboard.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                <a href="rooms.html" class="list-group-item list-group-item-action bg-dark text-white active"><i class="bi bi-door-open me-2"></i> Rooms</a>
                <a href="bookings.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-calendar-check me-2"></i> Bookings</a>
                <a href="index.html" class="list-group-item list-group-item-action bg-dark text-white mt-5"><i class="bi bi-box-arrow-left me-2"></i> Logout</a>
            </div>
        </div>
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
                <div class="container-fluid">
                    <button class="btn btn-outline-secondary btn-sm" id="sidebarToggle"><i class="bi bi-list"></i></button>
                    <div class="ms-auto d-flex align-items-center"><span class="me-3 fw-bold text-secondary d-none d-md-block">Admin</span><img src="https://picsum.photos/seed/admin/40/40" class="rounded-circle border"></div>
                </div>
            </nav>
            <div class="container-fluid px-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fs-3 fw-bold text-dark">Rooms List</h2>
                    <button class="btn btn-gold" onclick="openAddRoomModal()"><i class="bi bi-plus-lg me-1"></i> Add New Room</button>
                </div>
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle" id="roomsTable">
                                <thead class="table-light"><tr><th>Room No</th><th>Type</th><th>Price</th><th>Status</th><th>Action</th></tr></thead>
                                <tbody>
                                    <tr id="row-room-101"><td class="fw-bold">101</td><td>Deluxe King</td><td>$120</td><td><span class="badge bg-success">Available</span></td><td><button class="btn btn-sm btn-light border text-primary" onclick="editRoom('room-101')"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-light border text-danger" onclick="deleteRoom('room-101')"><i class="bi bi-trash"></i></button></td></tr>
                                    <tr id="row-room-102"><td class="fw-bold">102</td><td>Standard Twin</td><td>$90</td><td><span class="badge bg-danger">Occupied</span></td><td><button class="btn btn-sm btn-light border text-primary" onclick="editRoom('room-102')"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-light border text-danger" onclick="deleteRoom('room-102')"><i class="bi bi-trash"></i></button></td></tr>
                                    <tr id="row-room-201"><td class="fw-bold">201</td><td>Suite Ocean</td><td>$250</td><td><span class="badge bg-warning text-dark">Maintenance</span></td><td><button class="btn btn-sm btn-light border text-primary" onclick="editRoom('room-201')"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-light border text-danger" onclick="deleteRoom('room-201')"><i class="bi bi-trash"></i></button></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addRoomModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow"><div class="modal-header border-0"><h5 class="modal-title fw-bold">Add Room</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="addRoomForm"><div class="mb-3"><label class="small text-muted">Room No</label><input type="text" class="form-control" id="newRoomNo" required></div><div class="mb-3"><label class="small text-muted">Type</label><input type="text" class="form-control" id="newRoomType" required></div><div class="mb-3"><label class="small text-muted">Price ($)</label><input type="number" class="form-control" id="newRoomPrice" required></div><div class="mb-3"><label class="small text-muted">Status</label><select class="form-select" id="newRoomStatus"><option value="Available">Available</option><option value="Occupied">Occupied</option><option value="Maintenance">Maintenance</option></select></div></form></div><div class="modal-footer border-0"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-gold px-4" onclick="saveNewRoom()">Add</button></div></div></div></div>
    <div class="modal fade" id="editRoomModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow"><div class="modal-header border-0"><h5 class="modal-title fw-bold">Edit Room</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="editRoomForm"><input type="hidden" id="editRoomId"><div class="mb-3"><label class="small text-muted">Room No</label><input type="text" class="form-control bg-light" id="editRoomNo" readonly></div><div class="mb-3"><label class="small text-muted">Type</label><input type="text" class="form-control" id="editRoomType" required></div><div class="mb-3"><label class="small text-muted">Price ($)</label><input type="number" class="form-control" id="editRoomPrice" required></div><div class="mb-3"><label class="small text-muted">Status</label><select class="form-select" id="editRoomStatus"><option value="Available">Available</option><option value="Occupied">Occupied</option><option value="Maintenance">Maintenance</option></select></div></form></div><div class="modal-footer border-0"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-gold px-4" onclick="saveRoomChanges()">Save</button></div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="script.js"></script>
    <script>document.getElementById("sidebarToggle").addEventListener("click",function(e){e.preventDefault();document.getElementById("wrapper").classList.toggle("toggled");document.body.classList.toggle("sb-sidenav-toggled");});</script>
</body>
</html>
