<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="sb-sidenav-toggled">
    <div class="d-flex" id="wrapper">
        <div class="bg-dark border-end" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom bg-gold text-dark text-center py-3"><i class="bi bi-building-fill-gear fs-4 me-2"></i> EASTON HOTEL</div>
            <div class="list-group list-group-flush">
                <a href="dashboard.html" class="list-group-item list-group-item-action bg-dark text-white active"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                <a href="rooms.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-door-open me-2"></i> Rooms</a>
                <a href="bookings.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-calendar-check me-2"></i> Bookings</a>
                <a href="index.html" class="list-group-item list-group-item-action bg-dark text-white mt-5"><i class="bi bi-box-arrow-left me-2"></i> Logout</a>
            </div>
        </div>
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
                <div class="container-fluid">
                    <button class="btn btn-outline-secondary btn-sm" id="sidebarToggle"><i class="bi bi-list"></i></button>
                    <div class="ms-auto d-flex align-items-center"><span class="me-3 fw-bold text-secondary d-none d-md-block">Admin</span><img src="https://picsum.photos/seed/admin/40/40" class="rounded-circle border"></div>
                </div>
            </nav>
            <div class="container-fluid px-4 py-4">
                <h2 class="fs-3 mb-4 text-dark fw-bold">Dashboard Overview</h2>
                
                <!-- REAL STATS CARDS -->
                <div class="row g-3 mb-4">
                    <div class="col-md-3"><div class="card stat-card border-0 shadow-sm h-100"><div class="card-body"><div class="d-flex justify-content-between"><div><p class="text-muted mb-1 small">Total Bookings</p><h3 class="fw-bold mb-0" id="stat-total-bookings">0</h3></div><div class="icon-box bg-primary bg-opacity-10 text-primary"><i class="bi bi-calendar-event fs-2"></i></div></div></div></div></div>
                    <div class="col-md-3"><div class="card stat-card border-0 shadow-sm h-100"><div class="card-body"><div class="d-flex justify-content-between"><div><p class="text-muted mb-1 small">Available Rooms</p><h3 class="fw-bold mb-0" id="stat-available-rooms">0</h3></div><div class="icon-box bg-success bg-opacity-10 text-success"><i class="bi bi-door-closed fs-2"></i></div></div></div></div></div>
                    <div class="col-md-3"><div class="card stat-card border-0 shadow-sm h-100"><div class="card-body"><div class="d-flex justify-content-between"><div><p class="text-muted mb-1 small">Total Revenue</p><h3 class="fw-bold mb-0" id="stat-total-revenue">$0</h3></div><div class="icon-box bg-warning bg-opacity-10 text-warning"><i class="bi bi-currency-dollar fs-2"></i></div></div></div></div></div>
                    <div class="col-md-3"><div class="card stat-card border-0 shadow-sm h-100"><div class="card-body"><div class="d-flex justify-content-between"><div><p class="text-muted mb-1 small">Total Rooms</p><h3 class="fw-bold mb-0" id="stat-total-rooms">0</h3></div><div class="icon-box bg-danger bg-opacity-10 text-danger"><i class="bi bi-building fs-2"></i></div></div></div></div></div>
                </div>

                <div class="row">
                    <div class="col-lg-8 mb-4"><div class="card border-0 shadow-sm"><div class="card-header bg-white border-0 py-3"><h6 class="m-0 fw-bold text-primary">Revenue Jan-June 2026</h6></div><div class="card-body"><canvas id="revenueChart" style="max-height:350px"></canvas></div></div></div>
                    <div class="col-lg-4 mb-4"><div class="card border-0 shadow-sm h-100"><div class="card-header bg-white border-0 py-3"><h6 class="m-0 fw-bold text-primary">Room Types</h6></div><div class="card-body d-flex align-items-center justify-content-center"><canvas id="roomTypeChart" style="max-height:250px"></canvas></div></div></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="script.js"></script>
    <script>document.getElementById("sidebarToggle").addEventListener("click",function(e){e.preventDefault();document.getElementById("wrapper").classList.toggle("toggled");document.body.classList.toggle("sb-sidenav-toggled");});</script>
</body>
</html>
